apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: contoso-platform
  title: Contoso Platform
  description: Shared platform capabilities and reference implementation for squads.
spec:
  owner: group:platform

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: contoso-orders
  title: Contoso Orders Platform
  description: Event-driven order processing with real-time notifications (reference implementation).
  tags:
    - azure
    - kubernetes
    - dotnet
    - event-driven
  links:
    - url: https://github.com/ivantorres89/event-driven-microservices-orders/tree/main/architecture
      title: Architecture docs (repo)
      icon: docs
    - url: https://github.com/ivantorres89/event-driven-microservices-orders/blob/main/architecture/eventdriven-orders-signalr-redis-backplane.drawio
      title: Architecture diagram (draw.io)
      icon: diagram
    - url: https://github.com/ivantorres89/event-driven-microservices-orders/blob/main/architecture/eventdriven-orders-signalr-redis-backplane.jpg
      title: Architecture diagram (preview)
      icon: diagram
    - url: https://github.com/ivantorres89/event-driven-microservices-orders/blob/main/architecture/decisions.md
      title: Architecture decisions (ADR-style)
      icon: docs
spec:
  owner: group:platform
  domain: contoso-platform

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  title: Platform Engineering
  description: Platform team owning the reference platform and shared building blocks.
spec:
  type: team
  profile:
    displayName: Platform Engineering
    email: platform@contoso.example
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: sql-database
  title: Relational Database (Azure SQL Database)
  description: System-of-record for orders (SQL Server locally; Azure SQL Database in Azure).
spec:
  type: database
  owner: group:platform
  system: contoso-orders

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: redis
  title: Redis Cache
  description: Ephemeral workflow/session state for real-time UX and SignalR scale-out.
spec:
  type: cache
  owner: group:platform
  system: contoso-orders

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: message-broker
  title: Message Broker (Azure Service Bus)
  description: Asynchronous integration events (RabbitMQ locally; Azure Service Bus in Azure).
spec:
  type: queue
  owner: group:platform
  system: contoso-orders

---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: contoso-orders-catalog
  description: Service catalog definition for the Contoso Orders reference platform.
spec:
  type: file
  targets:
    - ./services/order-accept/catalog-info.yaml
    - ./services/order-process/catalog-info.yaml
    - ./services/order-notification/catalog-info.yaml
    - ./frontend/catalog-info.yaml
    - ./architecture/catalog-info.yaml
